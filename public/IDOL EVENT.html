<script>

const ELEVEN_VOICE_ID = 'fxaaFJ8KYS2XTYCXowoU';

let cart = [];

const GREETING = '천안 시장 아이돌 이벤트에 오신 걸 환영합니다!<br>첫 번째 단서의 흰트를 알려드리겠습니다.<br>흰트 버튼을 클릭해주세요';

const MSG_ANSWER_STAGE1 = '오~~ 똑똑하신데요. 좋아요! 다음 단서 찾으러 이동해볼까요??';
const MSG_STAGE2_START = '2단계입니다! 힌트 버튼을 눌러주세요!';
const MSG_ANSWER_STAGE2 = '오~~ 이번에도 멋지게 맞추셨네요 마지막 단서를 찾으러가볼까요??';
const MSG_STAGE3_START = '3단계입니다~! 힌트 버튼을 눌러주세요!!';
const MSG_HINT_STAGE3 = '힌트를 알려드릴게요! 마지막인만큼 매우매우 어려워요! 시장 곳곳을 살펴보면 추가로 힌트가 있습니다!!';
const MSG_ANSWER_FINAL = '마지막까지 멋지게 맞추셨네요!! 시장에서 사용가능한 포인트와 굿즈 추첨권을 선물로드릴게요!!';

const PRICES = {
  '아메리카노': 3500,

};
function needsTemp(menu){
  return ['아메리카노', '카페라떼', '바닐라 라떼', '고구마 라떼'].includes(menu);
}

function addMsg(role, text){
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="bubble">${text}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function setStatus(text){
  document.getElementById('status').textContent = text;
}

function numberToKorean(num){
  num = Number(num);
  if(num === 0) return '영';

  const nums = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];

  function under10000ToKorean(n){
    let result = '';

    const thousands = Math.floor(n / 1000);
    const hundreds = Math.floor((n % 1000) / 100);
    const tens = Math.floor((n % 100) / 10);
    const ones = n % 10;

    if(thousands) result += (thousands === 1 ? '' : nums[thousands]) + '천';
    if(hundreds) result += (hundreds === 1 ? '' : nums[hundreds]) + '백';
    if(tens) result += (tens === 1 ? '' : nums[tens]) + '십';
    if(ones) result += nums[ones];

    return result;
  }

  const man = Math.floor(num / 10000);
  const rest = num % 10000;

  let result = '';

  if(man > 0){
    result += (man === 1 ? '' : under10000ToKorean(man)) + '만';
  }

  if(rest > 0){
    result += under10000ToKorean(rest);
  }

  return result;
}
function speechText(text){
  return text
    .replaceAll('NOVA CAFE', '노바 카페')
    .replaceAll('NOVA', '노바')
    .replaceAll('CAFE', '카페')
    .replace(/([\d,]+)원/g, (_, price) => {
      const num = Number(price.replaceAll(',', ''));
      return numberToKorean(num) + '원';
    });
  }

function speakFallback(text){
  speechSynthesis.cancel();
  const uttr = new SpeechSynthesisUtterance(speechText(text));
  uttr.lang = 'ko-KR';
  speechSynthesis.speak(uttr);
}

async function speak(text){
  if(!voiceOn) return;

  const mySeq = ++speakSeq;
  const voiceText = speechText(text);

  try{
    if(currentAudio){
      currentAudio.pause();
      currentAudio = null;
    }
    speechSynthesis.cancel();

    const avatar = document.getElementById('avatar');
    avatar.classList.add('speaking');

    const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${ELEVEN_VOICE_ID}`, {
      method: "POST",
      headers: {
        "xi-api-key": ELEVEN_API_KEY,
        "Content-Type": "application/json",
        "Accept": "audio/mpeg"
      },
      body: JSON.stringify({
        text: voiceText,
        model_id: "eleven_multilingual_v2",
        voice_settings: {
          stability: 0.45,
          similarity_boost: 0.8,
          style: 0.35,
          use_speaker_boost: true
        }
      })
    });

    if(mySeq !== speakSeq) return;
    if(!res.ok) throw new Error(await res.text());

    const blob = await res.blob();
    if(mySeq !== speakSeq) return;

    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio;

    audio.onended = () => {
      if(mySeq === speakSeq){
        avatar.classList.remove('speaking');
        currentAudio = null;
      }
      URL.revokeObjectURL(url);
    };

    await audio.play();

  }catch(e){
    if(mySeq !== speakSeq) return;
    console.error('ElevenLabs 실패 → 기본 TTS 사용:', e);
    document.getElementById('avatar').classList.remove('speaking');
    speakFallback(text);
  }
}

function toggleVoice(){
  voiceOn = !voiceOn;
  document.querySelector('.voice-on').textContent = voiceOn ? '🔊 ON' : '🔇 OFF';
  if(!voiceOn){
    if(currentAudio) currentAudio.pause();
    speechSynthesis.cancel();
  }
}

function extractQty(text){
  const t = text.replace(/\s+/g,'');

  const n = t.match(/(\d+)/);
  if(n) return Math.min(10, Math.max(1, Number(n[1])));

  if(t.includes('열')) return 10;
  if(t.includes('아홉')) return 9;
  if(t.includes('여덟')) return 8;
  if(t.includes('일곱')) return 7;
  if(t.includes('여섯')) return 6;
  if(t.includes('다섯')) return 5;
  if(t.includes('네잔') || t.includes('넷') || t.includes('네개')) return 4;
  if(t.includes('세잔') || t.includes('셋') || t.includes('세개')) return 3;
  if(t.includes('두잔') || t.includes('둘') || t.includes('두개')) return 2;
  if(t.includes('한잔') || t.includes('하나') || t.includes('한개')) return 1;

  return 1;
}

function qtyToKorean(qty){
  return {
    1:'한',2:'두',3:'세',4:'네',5:'다섯',
    6:'여섯',7:'일곱',8:'여덟',9:'아홉',10:'열'
  }[qty] || String(qty);
}

function formatQty(qty){
  return `${qtyToKorean(qty)} 잔`;
}

function extractTemp(text){
  if(text.includes('아이스') || text.includes('차갑')) return '아이스';
  if(text.includes('핫') || text.includes('따뜻') || text.includes('뜨거')) return '핫';
  return '';
}

function normalizeMenu(text){
  const t = text.replace(/\s+/g,'');
  if(t.includes('아메리카노') || t.includes('아아')) return '아메리카노';
  if(t.includes('카페라떼') || t.includes('카페라테')) return '카페라떼';
  if(t.includes('초코프라페')) return '초코 프라페';
  if(t.includes('바닐라라떼')) return '바닐라 라떼';
  if(t.includes('딸기스무디')) return '딸기 스무디';
  if(t.includes('고구마라떼')) return '고구마 라떼';
  return null;
}

function makeOrder(text){
  const menu = normalizeMenu(text);
  if(!menu) return null;

  const temp = extractTemp(text) || pendingTemp;
  pendingTemp = '';

  return {
    menu,
    qty: extractQty(text),
    temp
  };
}

function formatItem(item){
  return `${item.temp ? item.temp + ' ' : ''}${item.menu} ${formatQty(item.qty)}`;
}

function itemPrice(item){
  return (PRICES[item.menu] || 4500) * item.qty;
}

function totalPrice(){
  return cart.reduce((sum, item) => sum + itemPrice(item), 0);
}

function won(n){
  return `${n.toLocaleString('ko-KR')}원`;
}

function renderCart(){
  const list = document.getElementById('cart-list');
  const total = document.getElementById('cart-total');
  const payBtn = document.getElementById('pay-btn');
  const hintBtn = document.getElementById('hint-btn');
  const answerBtn = document.getElementById('answer-btn');
  const stage2Btn = document.getElementById('stage2-btn');
  const stage3Btn = document.getElementById('stage3-btn');

  hintBtn.style.display = 'inline-block';
  hintBtn.disabled = true;
  answerBtn.style.display = 'none';
  stage2Btn.style.display = 'none';
  stage3Btn.style.display = 'none';
  payBtn.disabled = true;

  if(eventStep === 0){
    list.textContent = '데모입니다. 힌트 버튼을 눌러 진행해주세요.';
    total.textContent = '1번째';
    hintBtn.disabled = false;
    return;
  }

  if(eventStep === 1){
    list.textContent = '1단계 힌트 확인 완료! 정답 입력하기 버튼을 눌러주세요.';
    total.textContent = '1단계 정답';
    answerBtn.style.display = 'inline-block';
    answerBtn.disabled = false;
    return;
  }

  if(eventStep === 2){
    list.textContent = '좋아요! 2단계 진행하기 버튼이 열렸어요.';
    total.textContent = '2단계 이동';
    stage2Btn.style.display = 'inline-block';
    stage2Btn.disabled = false;
    return;
  }

  if(eventStep === 3){
    list.textContent = '2단계입니다. 힌트 버튼을 눌러주세요!';
    total.textContent = '2단계 힌트';
    hintBtn.disabled = false;
    return;
  }

  if(eventStep === 4){
    list.textContent = '2단계 힌트 확인 완료! 정답 입력하기 버튼을 눌러주세요.';
    total.textContent = '2단계 정답';
    answerBtn.style.display = 'inline-block';
    answerBtn.disabled = false;
    return;
  }

  if(eventStep === 5){
    list.textContent = '멋져요! 3단계 진행하기 버튼이 열렸어요.';
    total.textContent = '3단계 이동';
    stage3Btn.style.display = 'inline-block';
    stage3Btn.disabled = false;
    return;
  }

  if(eventStep === 6){
    list.textContent = '3단계입니다~! 힌트 버튼을 눌러주세요!!';
    total.textContent = '3단계 힌트';
    hintBtn.disabled = false;
    return;
  }

  if(eventStep === 7){
    list.textContent = '마지막 힌트 확인 완료! 정답 입력하기를 눌러주세요.';
    total.textContent = '최종 정답';
    answerBtn.style.display = 'inline-block';
    answerBtn.disabled = false;
    return;
  }

  if(eventStep === 8){
    list.textContent = '최종 정답 완료! 포인트와 추첨권 받기 버튼을 눌러주세요.';
    total.textContent = '보상 받기';
    payBtn.disabled = false;
    return;
  }

  if(eventStep === 9){
    list.textContent = '보상 수령 완료! 천안시장을 즐겨주세요.';
    total.textContent = '완료';
    return;
  }

  list.textContent = '이벤트를 진행해 주세요.';

function reply(input){
  if(input.includes('힌트 버튼') || input.includes('첫 번째 단서') || input.includes('첫번째 단서')){
    if(eventStep === 0){
      eventStep = 1;
      renderCart();
      return MSG_HINT_STAGE1;
    }
    if(eventStep === 3){
      eventStep = 4;
      renderCart();
      return '좋아요! 2단계 힌트를 확인했어요. 정답 입력하기 버튼을 눌러주세요!';
    }
    if(eventStep === 6){
      eventStep = 7;
      renderCart();
      return MSG_HINT_STAGE3;
    }
    return '지금 단계에서는 다른 버튼을 먼저 눌러주세요!';
  }

  if(input.includes('정답 입력')){
    if(eventStep === 1){
      eventStep = 2;
      renderCart();
      return MSG_ANSWER_STAGE1;
    }
    if(eventStep === 4){
      eventStep = 5;
      renderCart();
      return MSG_ANSWER_STAGE2;
    }
    if(eventStep === 7){
      eventStep = 8;
      renderCart();
      return MSG_ANSWER_FINAL;
    }
    if(eventStep === 0 || eventStep === 3 || eventStep === 6){
      return '먼저 힌트 버튼을 눌러주세요!';
    }
    return '지금은 다른 단계 버튼을 눌러 진행해 주세요!';
  }

  if(input.includes('2단계 진행하기')){
    if(eventStep !== 2){
      return '먼저 1단계 정답을 맞추고 2단계 진행하기를 눌러주세요!';
    }
    eventStep = 3;
    renderCart();
    return MSG_STAGE2_START;
  }

  if(input.includes('3단계 진행하기')){
    if(eventStep !== 5){
      return '먼저 2단계 정답을 맞추고 3단계 진행하기를 눌러주세요!';
    }
    eventStep = 6;
    renderCart();
    return MSG_STAGE3_START;
  }

  return '힌트 버튼부터 순서대로 진행해 주세요!';
}

function sendChip(text){
  const input = document.getElementById('input');
  input.value = text;
  send();
}

function resetEvent(){
  eventStep = 0;
  renderCart();
  const msg = '좋아요! 천안 시장 아이돌 이벤트를 처음부터 다시 시작할게요.';
  addMsg('agent', msg);
  speak(msg);
  setStatus('힌트 버튼을 눌러 진행해 주세요');
}

function claimReward(){
  if(eventStep !== 8){
    const msg = '최종 정답을 먼저 맞춰주세요!';
    addMsg('agent', msg);
    speak(msg);
    return;
  }

  eventStep = 9;
  renderCart();
  const msg = MSG_REWARD_DONE;
  addMsg('agent', msg);
  speak(msg);
  setStatus('이벤트 완료! 다음에 또 참여해주세요');
}

function send(){
  if(!started){
    started = true;
  }

  const input = document.getElementById('input');
  const text = input.value.trim();
  if(!text) return;

  input.value = '';
  addMsg('user', text);
  setStatus('윈터가 이벤트 안내를 준비하는 중...');

  setTimeout(() => {
    const res = reply(text);
    addMsg('agent', res);
    speak(res);
    setStatus('힌트 버튼을 눌러 진행해 주세요');
  }, 250);
}




window.addEventListener('DOMContentLoaded', () => {
  renderCart();
  addMsg('agent', GREETING);
});

document.addEventListener('click', () => {
  if(!started){
    started = true;
    speak(GREETING);
  }
}, { once:true });
